<section class="login-wrap">
  <!-- Pixel-accurate screen container -->
  <div id="screen-login-page-497-140">
    <!-- Background rectangle layer -->
    <div id="rect-654-766" class="layer-0" aria-hidden="true"></div>

    <!-- Card Frame -->
    <div id="frame-497-141" class="layer-1 surface">
      <!-- Labels from Figma -->
      <span id="text-498-143" class="text-ellipsis">Username</span>
      <span id="text-498-144" class="text-ellipsis">Password</span>

      <!-- Reactive form mapped into positioned containers -->
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <!-- Username container -->
        <div id="frame-498-146" class="input-wrap" [class.error]="invalid('email')">
          <!-- Real input aligned over placeholder text for pixel accuracy -->
          <input
            class="input-layer"
            type="email"
            formControlName="email"
            aria-label="Email"
            autocomplete="email"
          />
          <span class="placeholder text-ellipsis">Username</span>
        </div>

        <!-- Password container -->
        <div id="frame-498-147" class="input-wrap" [class.error]="invalid('password')">
          <input
            class="input-layer"
            type="password"
            formControlName="password"
            aria-label="Password"
            autocomplete="current-password"
          />
          <span class="placeholder text-ellipsis">Password</span>
        </div>

        <!-- Login button -->
        <button id="frame-498-151" type="submit" [disabled]="submitting()">
          <span class="button-text text-ellipsis">{{ submitting() ? '...' : 'Login' }}</span>
        </button>
      </form>

      <!-- Logo rectangle (placeholder) -->
      <div id="rect-527-145" aria-hidden="true"></div>
    </div>
  </div>
</section>
